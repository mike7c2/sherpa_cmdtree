[workspace]
members = ["lint", "decode"]
resolver = "2"

[package]
name = "cmdtree"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
description = "Voice command-tree grammar with free-text slots: YAML grammar, parser, and an optional wake-word / push-to-talk daemon over sherpa-onnx."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mike7c2/cmdtree"
readme = "README.md"
keywords = ["voice", "speech", "asr", "grammar", "push-to-talk"]
categories = ["command-line-utilities", "multimedia::audio", "parser-implementations"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"

# --- optional native deps ---
# microphone capture; the server does resampling/downmix/sharing for us
libpulse-binding = { version = "2", default-features = false, optional = true }
libpulse-simple-binding = { version = "2", default-features = false, optional = true }
evdev = { version = "0.12", optional = true }         # global hotkey via /dev/input (X11 + Wayland)
# in-process sherpa-onnx ASR; `download-binaries` fetches the prebuilt native lib
# (no local C++/CMake build). Add `sherpa-rs/cuda` for GPU (see the `sherpa-cuda` feature).
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries", "sys"], optional = true }

[features]
default = []
# pure push-to-talk daemon: hotkey-gated mic capture + in-process sherpa ASR.
# Links system libpulse (needs a PulseAudio-compatible server at runtime, e.g.
# pipewire-pulse). The hotkey is read from /dev/input via evdev, so it works under
# both X11 and Wayland (needs membership in the `input` group).
daemon = ["dep:evdev", "dep:libpulse-binding", "dep:libpulse-simple-binding", "sherpa"]
# native in-process ASR (sherpa-onnx offline transducer) + the `transcribe` CLI.
sherpa = ["dep:sherpa-rs"]
# sherpa with the CUDA execution provider (large GPU runtime download).
sherpa-cuda = ["sherpa", "sherpa-rs/cuda"]

[[bin]]
name = "cmdtree"
path = "src/main.rs"

[lib]
name = "cmdtree"
path = "src/lib.rs"
